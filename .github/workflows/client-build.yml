name: Client packages

on:
  push:
    tags: ['v*']
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    if: github.event_name == 'push' || github.event.label.name == 'build-test'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check version and release tag
        id: version
        env:
          RELEASE_BUILD: ${{ github.event_name == 'push' }}
        run: |
          version="$(cat VERSION | tr -d '\r\n')"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]?)\.(0|[1-9]{1,3})\.(0|[1-9]{1,3})$ ]]; then
            echo 'VERSION must be major.minor.patch (not 0.0.0)' >&2
            exit 1
          fi
          if [[ "$RELEASE_BUILD" == 'true' && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Release tag must match VERSION (v<version>)' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_BUILD: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare release signing
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing Android signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/barka.keystore"
      - name: Build APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/barka.keystore
          RELEASE_STORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_STORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
          CLIENT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p release-assets
          if [[ "$RELEASE_BUILD" == 'true' ]]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "release-assets/BarkA-${CLIENT_VERSION}-android.apk"
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/BarkA-${CLIENT_VERSION}-android-debug.apk"
          fi
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/barka.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push'
    needs: [version, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          merge-multiple: true
          path: release-assets
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLIENT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$CLIENT_VERSION"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes --draft
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false
